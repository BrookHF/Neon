[package]
name = "neon"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A minimal coding agent: one bash tool, Gemini over SSE, plugins as WASM."

[[bin]]
name = "neon"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
webpki-roots = "1"
yaml-rust2 = "0.10"
# Pure-Rust WASM interpreter for plugins. Chosen over the `wasm3` crate, which needs
# clang+bindgen at build and compiles WASM to native code (blocked under PRoot on Android).
# Features trimmed: no wat text parsing, no 64-bit memory, no auto-dispatch.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "stable"] }
ratatui = "0.30.2"
crossterm = "0.29.0"

[profile.release]
opt-level = 2
